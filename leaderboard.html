  <section id="table-1669">
    <div class="cs-container">
      <div class="cs-content">
        <span class="cs-topper">Leaderboard</span>
        <h2 class="cs-title">SportsMaster 2026 Leaderboard</h2>
        <p class="cs-text"></p>
      </div>
      <table id="leaderboard" class="cs-table hover">
        <thead>
          <tr class="cs-color">
            <th class="cs-th">SportsMaster</th>
            <th class="cs-th">Points</th>
            <th class="cs-th">Winners Selected</th>
            <th class="cs-th">Jokers Won</th>
          </tr>
        </thead>
      </table>
    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL = "https://vbalhcthklsmpyipmsmn.supabase.co"; // Project Settings → API
    const SUPABASE_ANON_KEY = "sb_publishable_6z9gEihOno3T_RXJSYfn9Q_0PJlnbM8"; // the anon (public) key only
    const SEASON_ID = 2026; // the id of the season in your seasons table

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadLeaderboard() {
      const { data, error } = await db
        .from("leaderboard")
        .select("name, points, winners_selected, jokers_won")
        .eq("season_id", SEASON_ID);

      if (error) {
        console.error("Leaderboard load failed:", error);
        return;
      }

      const rows = data.map((r) => ({
        SportsMaster: r.name,
        Points: Number(r.points),
        "Winners Selected": Number(r.winners_selected),
        "Jokers Won": Number(r.jokers_won),
      }));

      // Same tiebreaks as the table order, so medals match what people see
      rows.sort(
        (a, b) =>
          b.Points - a.Points ||
          b["Winners Selected"] - a["Winners Selected"] ||
          b["Jokers Won"] - a["Jokers Won"] ||
          a.SportsMaster.localeCompare(b.SportsMaster),
      );

      rows.forEach((row, i) => {
        row.award =
          i === 0
            ? "gold"
            : i === 1
              ? "silver"
              : i === 2
                ? "bronze"
                : i === rows.length - 1
                  ? "last"
                  : null;
      });

      new DataTable("#leaderboard", {
        data: rows,
        paging: true,
        pageLength: 50,
        order: [
          [1, "desc"],
          [2, "desc"],
          [3, "desc"],
          [0, "asc"],
        ],
        layout: {
          topStart: "search",
          bottomStart: "pageLength",
          bottomEnd: "paging",
          bottom2Start: "info",
        },
        scrollX: true,
        scrollY: false,
        columns: [
          { data: "SportsMaster" },
          { data: "Points" },
          { data: "Winners Selected" },
          { data: "Jokers Won" },
        ],
        rowCallback: function (row, data) {
          const icons = {
            gold: '<i class="fa-solid fa-medal" style="color:#FFD700;"></i>',
            silver: '<i class="fa-solid fa-medal" style="color:#C0C0C0;"></i>',
            bronze: '<i class="fa-solid fa-medal" style="color:#CD7F32;"></i>',
            last: '<i class="fa-solid fa-poo" style="color:#8B4513;"></i>',
          };
          const cell = $("td:eq(0)", row);
          cell.text(data.SportsMaster);
          if (data.award)
            cell.text(" " + data.SportsMaster).prepend(icons[data.award]);
        },
        drawCallback: function () {
          const rows = this.api().rows({ page: "current" }).nodes();
          $(rows).removeClass("top-row-1 top-row-2 top-row-3");
          if (rows.length > 0) $(rows[0]).addClass("top-row-1");
          if (rows.length > 1) $(rows[1]).addClass("top-row-2");
          if (rows.length > 2) $(rows[2]).addClass("top-row-3");
        },
      });
    }

    loadLeaderboard();
  </script>
