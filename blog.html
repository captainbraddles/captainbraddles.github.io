<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News | SportsMaster</title>

  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/standard.css" />
  <link rel="stylesheet" href="assets/css/core-styles.css" />
  <link rel="stylesheet" href="assets/css/navigation.css" />

  <style>
    #news-section { padding: 3rem 1rem 5rem; }
    .news-container { max-width: 1100px; margin: 0 auto; }

    .news-header { text-align: center; margin-bottom: 2.5rem; }
    .news-header h1 { margin: 0 0 .5rem; line-height: 1.2; }
    .news-header p { margin: 0; color: #666; }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .news-card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .1);
      transition: transform .2s, box-shadow .2s;
    }
    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
    }

    .news-image-link { display: block; aspect-ratio: 16 / 9; overflow: hidden; background: #eee; }
    .news-image-link img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .news-body { display: flex; flex-direction: column; flex: 1; padding: 1.5rem; }
    .news-meta { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: #777; margin-bottom: .5rem; }
    .news-title { margin: 0 0 .75rem; font-size: 1.5rem; line-height: 1.25; }
    .news-title a { color: inherit; text-decoration: none; }
    .news-title a:hover { text-decoration: underline; }
    .news-summary { margin: 0 0 1.25rem; line-height: 1.6; color: #444; }
    .news-more { margin-top: auto; font-weight: 700; text-decoration: none; }
    .news-more:hover { text-decoration: underline; }

    /* Newest post: full width, image beside text on desktop */
    .news-card.news-featured { grid-column: 1 / -1; flex-direction: row; }
    .news-featured .news-image-link { flex: 1.3; aspect-ratio: auto; min-height: 340px; }
    .news-featured .news-body { flex: 1; padding: 2rem; justify-content: center; }
    .news-featured .news-title { font-size: 2rem; }
    .news-featured .news-summary { font-size: 1.1rem; }

    @media (max-width: 800px) {
      .news-grid { grid-template-columns: 1fr; }
      .news-card.news-featured { flex-direction: column; }
      .news-featured .news-image-link { aspect-ratio: 16 / 9; min-height: 0; }
      .news-featured .news-title { font-size: 1.6rem; }
    }
  </style>
</head>

<body class="content">
  <script src="/assets/js/nav.js"></script>

  <div id="loader" class="loader"></div>
  <div id="content" class="hidden">
    <section id="news-section">
      <div class="news-container">
        <div class="news-header">
          <h1>SportsMaster News</h1>
          <p>The latest updates, announcements and results.</p>
        </div>
        <ul class="news-grid" id="output"></ul>
      </div>
    </section>
  </div>

  <script src="/assets/js/standard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/blog.js"></script>
</body>
</html>
